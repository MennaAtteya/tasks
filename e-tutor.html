<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-tutor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="./assets/css/etutor.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#" id="brandName">E-tutor</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="navLinks"></ul>
        <form class="d-flex me-3" role="search" style="max-width: 320px; width: 100%;">
          <input class="form-control" id="searchInput" type="search" placeholder="Search" aria-label="Search" />
        </form>
        <div class="d-flex gap-2" id="authButtons"></div>
      </div>
    </div>
  </nav>

  <main>
    <!-- Hero -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-lg-6">
            <h1 class="display-5 fw-bold" id="heroHeadline"></h1>
            <p class="text-secondary lead" id="heroSubtext"></p>
            <div class="mt-3">
              <a class="btn btn-primary" id="heroCta" href="#"></a>
            </div>
          </div>
          <div class="col-lg-6 text-center">
            <img class="img-fluid rounded shadow-sm hero-img" alt="hero" src="https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?q=80&w=1400&auto=format&fit=crop" />
          </div>
        </div>
      </div>
    </section>

    <!-- Categories -->
    <section class="py-5" id="categories">
      <div class="container">
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-4">
          <div>
            <h2 class="h3 mb-1" id="categoriesTitle"></h2>
            <p class="text-secondary small mb-0" id="categoriesNote"></p>
          </div>
          <a href="#" id="browseAllCategories" class="btn btn-outline-primary btn-sm">Browse All</a>
        </div>
        <div class="row g-3" id="categoriesContainer"></div>
      </div>
    </section>

    <!-- Best selling courses -->
    <section class="py-5 bg-body-tertiary" id="bestSelling">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h3 mb-0">Best selling courses</h2>
          <a href="#" id="bestSellingBrowseAll" class="btn btn-outline-primary btn-sm">Browse all Courses</a>
        </div>
        <div class="row g-3" id="bestSellingContainer"></div>
      </div>
    </section>

    <!-- Recently added -->
    <section class="py-5" id="recent">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h3 mb-0">Recently added courses</h2>
          <a href="#" id="recentBrowseAll" class="btn btn-outline-primary btn-sm">Browse all Courses</a>
        </div>
        <div class="row g-3" id="recentContainer"></div>
      </div>
    </section>

    <!-- Become an instructor CTA -->
    <section class="py-5 bg-primary-subtle" id="instructorCta">
      <div class="container">
        <div class="row g-4 align-items-center">
          <div class="col-lg-5">
            <div class="p-4 bg-white rounded shadow-sm h-100">
              <h3 class="mb-2" id="instructorTitle"></h3>
              <p class="text-secondary" id="instructorBlurb"></p>
              <a class="btn btn-primary" id="instructorCtaBtn" href="#"></a>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="p-4 bg-white rounded shadow-sm h-100">
              <h4 class="mb-3" id="stepsTitle"></h4>
              <ol class="list-group list-group-numbered" id="stepsList"></ol>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Top instructors -->
    <section class="py-5 bg-body-tertiary" id="topInstructors">
      <div class="container">
        <h2 class="h3 mb-4">Top instructors of the month</h2>
        <div class="row g-3" id="instructorsContainer"></div>
        <p class="small text-secondary mt-3" id="instructorsNote"></p>
        <a class="btn btn-outline-primary btn-sm" id="instructorsCta" href="#"></a>
      </div>
    </section>

    <!-- Trusted companies -->
    <section class="py-5" id="trusted">
      <div class="container text-center">
        <h2 class="h3" id="trustedHeadline"></h2>
        <p class="text-secondary" id="trustedDesc"></p>
        <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
          <img class="brand-logo" src="https://logo.clearbit.com/netflix.com" alt="Netflix" />
          <img class="brand-logo" src="https://logo.clearbit.com/youtube.com" alt="YouTube" />
          <img class="brand-logo" src="https://logo.clearbit.com/google.com" alt="Google" />
          <img class="brand-logo" src="https://logo.clearbit.com/lenovo.com" alt="Lenovo" />
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-top py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4">
          <h5 id="footerBrand"></h5>
          <p class="text-secondary" id="footerTagline"></p>
        </div>
        <div class="col-md-8">
          <div class="row" id="footerColumns"></div>
        </div>
      </div>
      <div class="text-center small text-secondary mt-4" id="copyright"></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/etutor.js" type="module"></script>
</body>
</html>
